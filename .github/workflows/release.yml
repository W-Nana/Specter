name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-agent:
    name: Build Agent (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      # 編譯靜態二進制
      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME}
          go build -ldflags "-s -w -X main.Version=${VERSION}" \
            -o ../dist/specter-agent-${{ matrix.target }} .

      - uses: actions/upload-artifact@v4
        with:
          name: specter-agent-${{ matrix.target }}
          path: dist/specter-agent-${{ matrix.target }}

  release:
    name: Create Release
    needs: build-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 下載所有架構的二進制
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum specter-agent-* > checksums.txt

      # 創建 GitHub Release + 上傳二進制
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/specter-agent-*
            dist/checksums.txt
